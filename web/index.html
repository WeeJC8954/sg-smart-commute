<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!--
    Content-Security-Policy (M5). The app is static files only: it talks to
    the four public, keyless APIs below, and the Flutter engine loads
    CanvasKit (script + WebAssembly) from www.gstatic.com and fallback fonts
    from fonts.gstatic.com. Nothing else may be loaded, posted or framed in.
    A <meta> policy cannot set frame-ancestors; static hosting would need a
    header for that. Rationale and the measured origin list:
    docs/architecture.md.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com 'sha256-MndvH2xoJITJx1vAmJTo0n71uGBofeMZfQTpl28Jz7s='; connect-src 'self' https://api-open.data.gov.sg https://www.onemap.gov.sg https://data.busrouter.sg https://arrivelah2.busrouter.sg https://www.gstatic.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Singapore Smart Commute">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sg_smart_commute">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sg_smart_commute</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--

    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
